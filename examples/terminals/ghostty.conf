# Ghostty: let Switchback have Ctrl+Tab and Ctrl+Shift+Tab.
#
# Ghostty uses both to switch its own tabs, so they never reach a program
# running inside it. Add these lines to ~/.config/ghostty/config (on macOS,
# ~/Library/Application Support/com.mitchellh.ghostty/config works too), then
# reload with Cmd+Shift+, (Ctrl+Shift+, on Linux).
#
# Ghostty speaks kitty's keyboard protocol whenever a program asks, so nothing
# else is needed.
keybind = ctrl+tab=unbind
keybind = ctrl+shift+tab=unbind
