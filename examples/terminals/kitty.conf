# kitty: let Switchback have Ctrl+Tab and Ctrl+Shift+Tab.
#
# kitty uses both to switch its own tabs, so they never reach a program
# running inside it. Add these lines to ~/.config/kitty/kitty.conf, then
# reload with Ctrl+Shift+F5 (Cmd+Ctrl+, on macOS).
#
# A `map` with no action removes kitty's shortcut. kitty speaks its keyboard
# protocol whenever a program asks, so nothing else is needed.
map ctrl+tab
map ctrl+shift+tab
