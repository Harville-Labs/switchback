# Postgres for local development and tests (`bun run db:up`). Production uses
# the cluster's CloudNativePG database; the site never stores data itself.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: switchback
      POSTGRES_PASSWORD: switchback
      POSTGRES_DB: switchback_site
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - switchback-site-postgres:/var/lib/postgresql
      # A second database for tests, so running them never touches dev data.
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "switchback", "-d", "switchback_site"]
      interval: 2s
      retries: 30
volumes:
  switchback-site-postgres:
