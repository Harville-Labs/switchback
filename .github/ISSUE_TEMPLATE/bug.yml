name: Bug report
description: Something doesn't work as documented
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command or prompt, and the output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [TUI, VS Code, harness run, other]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: harness doctor output
      render: text
  - type: input
    id: version
    attributes:
      label: Version (harness --version)
