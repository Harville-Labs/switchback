name: Feature
description: New capability or improvement
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Note protocol, config, or invariant impacts.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Concrete, checkable acceptance criteria.
    validations:
      required: true
