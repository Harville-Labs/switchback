name: Site image

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/engine/src/org/schema.ts
      - packages/engine/src/telemetry-schema.ts
      - scripts/install.sh
      - bun.lock
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: site-image-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/site/Dockerfile
          push: true
          tags: |
            ghcr.io/harville-labs/harness-site:main
            ghcr.io/harville-labs/harness-site:sha-${{ github.sha }}
      # Flux deploys whatever tag the kustomization names; pin it to this build.
      - name: Update the GitOps image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          sed -i "s/^    newTag: .*/    newTag: ${IMAGE_TAG}/" deploy/k8s/site/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/site/kustomization.yaml
          git commit -m "chore(site): deploy ${IMAGE_TAG}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
