name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.2

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun scripts/release.ts verify "$GITHUB_REF_NAME"
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          # native: build and run on the target platform
          - { os: ubuntu-latest, target: bun-linux-x64, platform: linux-x64, native: true }
          - { os: macos-latest, target: bun-darwin-arm64, platform: darwin-arm64, native: true }
          - { os: windows-latest, target: bun-windows-x64, platform: windows-x64, native: true, ext: .exe }
          # cross-compiled: no hosted runner guaranteed for these on private repos
          - { os: ubuntu-latest, target: bun-linux-arm64, platform: linux-arm64, native: false }
          - { os: macos-latest, target: bun-darwin-x64, platform: darwin-x64, native: false }
    runs-on: ${{ matrix.os }}
    env:
      OUT: dist/switchback-${{ needs.verify.outputs.version }}-${{ matrix.platform }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun apps/cli/scripts/build.ts --target ${{ matrix.target }} --outfile "$OUT"
        shell: bash
      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          export SWITCHBACK_HOME="$RUNNER_TEMP/switchback-home"
          test "$("./$OUT" --version)" = "${{ needs.verify.outputs.version }}"
          "./$OUT" run --mock "ping" | grep -q "You said: ping"
      - name: Check binary format
        if: ${{ !matrix.native }}
        shell: bash
        run: file "$OUT" | tee /dev/stderr | grep -Eq "Mach-O|ELF"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: ${{ env.OUT }}
          if-no-files-found: error

  vsix:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # One .vsix per platform with the engine binary inside, plus a universal
          # one that uses `switchback` from PATH.
          - { target: darwin-arm64, platform: darwin-arm64 }
          - { target: darwin-x64, platform: darwin-x64 }
          - { target: linux-x64, platform: linux-x64 }
          - { target: linux-arm64, platform: linux-arm64 }
          - { target: win32-x64, platform: windows-x64, ext: .exe }
          - { target: universal, platform: '' }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/vscode build
      - uses: actions/download-artifact@v4
        if: matrix.platform != ''
        with:
          name: bin-${{ matrix.platform }}
          path: bin-download
      - name: Bundle engine binary
        if: matrix.platform != ''
        run: |
          mkdir -p apps/vscode/bin
          cp "bin-download/switchback-$VERSION-${{ matrix.platform }}${{ matrix.ext }}" "apps/vscode/bin/switchback${{ matrix.ext }}"
          chmod +x "apps/vscode/bin/switchback${{ matrix.ext }}"
      - name: Third-party notices
        run: bun scripts/third-party-notices.ts --out apps/vscode/THIRD-PARTY-NOTICES.txt
      - name: Package
        working-directory: apps/vscode
        run: |
          mkdir -p ../../dist
          if [ "${{ matrix.target }}" = universal ]; then
            bunx @vscode/vsce package --no-dependencies --allow-missing-repository -o "../../dist/switchback-vscode-$VERSION.vsix"
          else
            bunx @vscode/vsce package --no-dependencies --allow-missing-repository --target ${{ matrix.target }} -o "../../dist/switchback-vscode-$VERSION-${{ matrix.target }}.vsix"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    needs: [verify, binaries, vsix]
    runs-on: ubuntu-latest
    env:
      # Marketplace publishing runs only when these secrets are configured.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: bun install --frozen-lockfile
      # Apache-2.0 and the bundled packages' licenses travel with the binaries.
      - name: License files
        run: |
          bun scripts/third-party-notices.ts --out dist/THIRD-PARTY-NOTICES.txt
          cp LICENSE NOTICE dist/
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          {
            bun scripts/release.ts notes "${{ needs.verify.outputs.version }}"
            echo
            echo "### Install"
            echo "On macOS and Linux: \`curl -fsSL https://switchback.harville.ai/install.sh | sh\` (add \`-s -- --vscode\` after \`sh\` for the VS Code extension too). Or download the binary for your platform, verify it against \`SHA256SUMS\`, make it executable, and put it on your PATH as \`switchback\`. Then run \`switchback init\`."
            echo "Install the VS Code extension for your platform with \`code --install-extension switchback-vscode-${{ needs.verify.outputs.version }}-<platform>.vsix\`; it includes the engine, so no separate install is needed. The universal .vsix uses \`switchback\` from your PATH."
            echo
            echo "Binaries are not yet signed or notarized (tracked for 1.0). On macOS, clear the quarantine flag with \`xattr -d com.apple.quarantine switchback\`."
          } > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.verify.outputs.version }}"
          prerelease=""
          case "$version" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Switchback $version" --notes-file notes.md $prerelease
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: for f in dist/switchback-vscode-*-*.vsix; do bunx @vscode/vsce publish --packagePath "$f" --pre-release; done
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: for f in dist/switchback-vscode-*-*.vsix; do bunx ovsx publish "$f" --pre-release; done
