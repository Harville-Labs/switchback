name: Live models

# Real-model tests. The local model runs in an Ollama service container.
# Hosted providers run only when their secret is set, each on its cheapest
# catalog model: OPENAI_API_KEY, DEEPSEEK_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY.
on:
  schedule:
    # Weekly: real-model runs are slow and small models are flaky day to day.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model (must support tool calling)
        default: qwen3:1.7b
      delegation:
        description: Also test subagent delegation locally (needs a stronger model)
        type: boolean
        default: false

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      ollama:
        image: ollama/ollama:latest
        ports: ['11434:11434']
        env:
          OLLAMA_CONTEXT_LENGTH: '16384'
    env:
      MODEL: ${{ inputs.model || 'qwen3:1.7b' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # External runtimes (tests/live/runtimes.test.ts); each runs only when its secrets are set.
      SWITCHBACK_LIVE_MANAGED_AGENT: ${{ secrets.SWITCHBACK_LIVE_MANAGED_AGENT }}
      SWITCHBACK_LIVE_MANAGED_ENVIRONMENT: ${{ secrets.SWITCHBACK_LIVE_MANAGED_ENVIRONMENT }}
      SWITCHBACK_LIVE_CODEX: ${{ secrets.OPENAI_API_KEY && '1' || '' }}
      SWITCHBACK_LIVE_AGENTCORE_ARN: ${{ secrets.SWITCHBACK_LIVE_AGENTCORE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Pull local model
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          curl -sf http://localhost:11434/api/pull -d "{\"model\":\"$MODEL\",\"stream\":false}"
      - name: Live tests
        env:
          SWITCHBACK_LIVE_LOCAL_URL: http://localhost:11434/v1
          SWITCHBACK_LIVE_LOCAL_MODEL: ${{ env.MODEL }}
          SWITCHBACK_LIVE_LOCAL_DELEGATION: ${{ inputs.delegation && '1' || '' }}
        run: bun run test:live
      - name: Classifier eval
        # A measurement, not a gate: precision/recall and latency go to the job summary.
        if: always()
        continue-on-error: true
        run: bun scripts/eval-classifier.ts --base-url http://localhost:11434/v1 --model "$MODEL"
