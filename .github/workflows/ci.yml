name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The bash sandbox's tests run for real: bubblewrap, socat, and ripgrep,
      # and Ubuntu 24.04+ must allow unprivileged user namespaces.
      - name: Sandbox dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The sandbox runtime needs ripgrep on macOS; without it the sandbox tests skip.
      - if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - run: bun test

  vscode:
    name: VS Code integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Integration tests in VS Code
        run: xvfb-run -a bun run --cwd apps/vscode test
      - name: Bundled engine (as shipped in the .vsix)
        run: xvfb-run -a bun run --cwd apps/vscode test:bundled

  build:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Compile CLI binary
        run: bun apps/cli/scripts/build.ts --outfile dist/switchback
      - name: Smoke test binary
        shell: bash
        run: |
          export SWITCHBACK_HOME="$RUNNER_TEMP/switchback-home"
          ./dist/switchback --version
          ./dist/switchback run --mock "ping" | grep -q "You said: ping"
      # Packaging validates the manifest and README the way the Marketplace will.
      - name: Package VS Code extension
        if: matrix.os == 'ubuntu-latest'
        run: bun run --cwd apps/vscode package -o ../../dist/switchback-vscode.vsix
