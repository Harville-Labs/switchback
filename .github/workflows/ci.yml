name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The site's tests run against real Postgres, like production.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: switchback
          POSTGRES_PASSWORD: switchback
          POSTGRES_DB: switchback_site_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U switchback" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://switchback:switchback@localhost:5432/switchback_site_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Site (svelte-check and build)
        run: bun run --cwd apps/site check && bun run --cwd apps/site build
      - run: bun test

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test

  vscode:
    name: VS Code integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Integration tests in VS Code
        run: xvfb-run -a bun run --cwd apps/vscode test
      - name: Bundled engine (as shipped in the .vsix)
        run: xvfb-run -a bun run --cwd apps/vscode test:bundled

  build:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Compile CLI binary
        run: bun apps/cli/scripts/build.ts --outfile dist/switchback
      - name: Smoke test binary
        shell: bash
        run: |
          export SWITCHBACK_HOME="$RUNNER_TEMP/switchback-home"
          ./dist/switchback --version
          ./dist/switchback run --mock "ping" | grep -q "You said: ping"
      # Packaging validates the manifest and README the way the Marketplace will.
      - name: Package VS Code extension
        if: matrix.os == 'ubuntu-latest'
        run: bun run --cwd apps/vscode package -o ../../dist/switchback-vscode.vsix
