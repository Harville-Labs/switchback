name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  build:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Compile CLI binary
        run: bun apps/cli/scripts/build.ts --outfile dist/harness
      - name: Smoke test binary
        shell: bash
        run: |
          export HARNESS_HOME="$RUNNER_TEMP/harness-home"
          ./dist/harness --version
          ./dist/harness run --mock "ping" | grep -q "You said: ping"
      - name: Build VS Code extension
        if: matrix.os == 'ubuntu-latest'
        run: bun run --cwd apps/vscode build
